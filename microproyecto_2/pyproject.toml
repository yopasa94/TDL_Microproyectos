[project]
name = "microproyecto-2"
version = "0.1.0"
description = "Clasificación de Sentimientos de Reseñas de Películas en IMDb con Redes Neuronales Recurrentes"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nltk>=3.8.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
]

[project.scripts]
microproyecto-2 = "microproyecto_2:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
