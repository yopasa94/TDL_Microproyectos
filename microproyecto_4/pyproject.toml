[project]
name = "microproyecto-4"
version = "0.1.0"
description = "Clasificación de Sonidos de la Naturaleza (ESC-50) usando Audio Spectrogram Transformer (AST)"
readme = "README.md"
authors = [
    { email = "" }
]
requires-python = ">=3.15"
dependencies = [
    "datasets>=3.0.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "soundfile>=0.12.1",
    "torch>=2.15.0",
    "torchaudio>=2.5.0",
    "transformers>=5.20.2",
]

[project.scripts]
microproyecto-4 = "microproyecto_4:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
