[project]
name = "microproyecto-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy<2",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.2.2",
    "torchvision>=0.17.2",
]

[project.scripts]
microproyecto-1 = "microproyecto_1:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
